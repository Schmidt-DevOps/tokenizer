name: Flutter CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # https://github.com/actions/checkout

      - name: Install requirements
        run: apt update && apt install -y jq lcov

      - name: Set up Flutter
        uses: https://github.com/subosito/flutter-action@v2 # https://github.com/subosito/flutter-action
        with:
          flutter-version: '3.5.0'

      - name: Install dependencies
        run: make pub-get

      - name: Run tests
        run: make test
